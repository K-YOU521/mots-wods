<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Mots & Words</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#202124;background:#fafafa;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{padding:25px 20px 12px;max-width:700px;margin:auto}header small{font-size:11px;letter-spacing:.14em;color:#777}h1{font-size:25px;margin:6px 0 2px;letter-spacing:-.03em}main{max-width:700px;margin:auto;padding:8px 16px 110px}.muted{color:#777}.small{font-size:12px}.panel,.word-card{background:#fff;border:1px solid #ececec;border-radius:16px;padding:17px;margin:10px 0}.word-card{width:100%;text-align:left;display:block;color:inherit}.word-card strong{font-size:18px;overflow-wrap:anywhere}.word-card .translation{font-size:14px;color:#777;margin-top:7px}.stars{color:#bf8628;letter-spacing:2px}.subtle-stars{color:#d8d8d8}input,textarea,select{width:100%;border:1px solid #dedede;border-radius:10px;padding:12px;background:white;color:#222;outline-offset:2px}textarea{min-height:105px;resize:vertical}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}.primary{border:0;background:#202124;color:white;border-radius:12px;padding:14px 18px;font-weight:600}.secondary{background:white;color:#222;border:1px solid #ddd;border-radius:12px;padding:12px 15px}.danger{color:#ad3333;border-color:#e7c8c8}.row{display:flex;align-items:center;gap:10px}.row>*{min-width:0}.grow{flex:1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.filter-label{font-size:12px;color:#777;margin-bottom:5px}.empty{padding:45px 14px;text-align:center;color:#777}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{width:25%;max-width:165px;background:none;border:0;color:#777;font-size:11px;padding:5px 0}.nav button.active{color:#111;font-weight:700}.nav .symbol{display:block;font-size:22px;margin-bottom:3px}.hidden{display:none!important}.rating-picker{display:flex;gap:7px}.rating-picker button{font-size:31px;color:#ccc;background:none;border:0;padding:0 4px}.rating-picker button.active{color:#bf8628}.detail-word{font-size:26px;font-weight:700;overflow-wrap:anywhere}.divider{border:0;border-top:1px solid #eee;margin:19px 0}.detail-section{margin:20px 0}.detail-section .heading{font-size:12px;color:#777;margin-bottom:8px}.detail-section p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:14px 0}.calendar-grid .weekday{text-align:center;color:#777;font-size:12px;padding:6px 0}.calendar-grid button{border:0;background:transparent;min-height:48px;border-radius:9px;position:relative}.calendar-grid button.selected{background:#eaeaea;font-weight:700}.calendar-grid button .dot{display:block;width:5px;height:5px;border-radius:50%;background:#b4853c;margin:4px auto 0}.calendar-grid button:disabled{cursor:default}.notice{font-size:12px;color:#666;line-height:1.65}.settings-action{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:white;text-align:left;padding:15px 2px;border-bottom:1px solid #eee}.settings-action:last-child{border-bottom:0}.pill{font-size:12px;color:#777}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:9;max-width:90%;text-align:center}.button-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.button-row button{flex:1}#detailView{padding-top:4px}
</style></head><body><header><small>MY VOCABULARY</small><h1 id="pageTitle">単語コレクション</h1></header><main>
<section id="listView"><input id="search" type="search" placeholder="フランス語・英語・日本語訳・メモを検索" aria-label="単語を検索"><div class="filters"><div><div class="filter-label">並べ替え</div><select id="sort"><option value="new">登録日：新しい順</option><option value="old">登録日：古い順</option><option value="high">似てる度：高い順</option><option value="low">似てる度：低い順</option></select></div><div><div class="filter-label">似てる度</div><select id="filter"><option value="all">すべて</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option><option value="none">未評価</option></select></div></div><p id="count" class="small muted"></p><div id="cards"></div></section>
<section id="formView" class="hidden"><form id="wordForm" class="panel"><label for="fr">フランス語 <span class="muted">*</span></label><input id="fr" maxlength="200" required autocomplete="off" placeholder="例：différent"><label for="en">英語 <span class="muted">*</span></label><input id="en" maxlength="200" required autocomplete="off" placeholder="例：different"><label for="ja">日本語訳（任意）</label><input id="ja" maxlength="300" placeholder="例：異なる"><label>似てる度（任意）</label><div id="ratingPicker" class="rating-picker" role="group" aria-label="似てる度"></div><button type="button" id="clearRating" class="secondary" style="margin-top:8px;font-size:12px;padding:6px 10px">未評価にする</button><label for="memo">メモ（任意）</label><textarea id="memo" maxlength="10000" placeholder="綴りの共通点や気づいたこと"></textarea><div class="button-row"><button type="button" id="cancelEdit" class="secondary hidden">キャンセル</button><button class="primary" type="submit" id="saveBtn">登録する</button></div></form></section>
<section id="detailView" class="hidden"><button id="backBtn" class="secondary">← 戻る</button><div id="detailContent" class="panel"></div><div class="button-row"><button id="editBtn" class="primary">編集する</button><button id="deleteBtn" class="secondary danger">削除する</button></div></section>
<section id="calendarView" class="hidden"><div class="panel"><div class="calendar-head"><button id="prevMonth" class="secondary" aria-label="前月">‹</button><strong id="monthTitle"></strong><button id="nextMonth" class="secondary" aria-label="翌月">›</button></div><div id="calendarGrid" class="calendar-grid"></div></div><h3 id="selectedDateTitle"></h3><div id="dayCards"></div></section>
<section id="settingsView" class="hidden"><div class="panel"><strong>データ管理</strong><button id="exportBtn" class="settings-action"><span>↓ バックアップを作成<br><span class="muted small">JSONファイルとして書き出す</span></span><span>›</span></button><button id="importBtn" class="settings-action"><span>↑ バックアップから復元<br><span class="muted small">JSONファイルを読み込む</span></span><span>›</span></button><input type="file" id="importFile" accept=".json,application/json" class="hidden"><p class="notice">復元時は既存の記録を置き換えます。確認画面を表示してから実行します。iCloud Driveにバックアップファイルを保存できますが、自動同期ではありません。</p></div><div class="panel row"><span class="grow">登録単語数</span><strong id="totalCount">0組</strong></div><p class="notice">データはこの端末のブラウザ内（IndexedDB）に保存されます。ブラウザのデータ消去や端末の故障に備えて、定期的にバックアップしてください。</p></section>
</main><nav class="nav" aria-label="メインメニュー"><button data-tab="list" class="active"><span class="symbol">▤</span>単語一覧</button><button data-tab="form"><span class="symbol">⊕</span>登録</button><button data-tab="calendar"><span class="symbol">▦</span>カレンダー</button><button data-tab="settings"><span class="symbol">⚙</span>設定</button></nav><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const $=id=>document.getElementById(id);let db,words=[],rating=null,editingId=null,detailId=null,activeTab='list';let currentMonth=new Date();currentMonth.setDate(1);let selectedDate=localDate(new Date());let detailReturn='list';
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function notify(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('mots-words',1);req.onupgradeneeded=()=>{const store=req.result.createObjectStore('words',{keyPath:'id'});store.createIndex('createdAt','createdAt')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function txRequest(mode,work){return new Promise((resolve,reject)=>{const tx=db.transaction('words',mode),store=tx.objectStore('words');let result;try{result=work(store)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(result?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function refresh(){words=await txRequest('readonly',s=>s.getAll());$('totalCount').textContent=`${words.length}組`;renderList();renderCalendar()}
function el(tag,cls,txt){const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node}
function stars(n){return n? '★'.repeat(n)+'☆'.repeat(5-n):'未評価'}
function makeCard(w){const b=el('button','word-card');b.type='button';b.append(el('strong','',`${w.fr} ↔ ${w.en}`));if(w.ja)b.append(el('div','translation',w.ja));const s=el('div','stars',stars(w.rating));if(!w.rating)s.className='translation';s.style.marginTop='10px';b.append(s);b.addEventListener('click',()=>showDetail(w.id,activeTab));return b}
function renderList(){const q=$('search').value.trim().toLocaleLowerCase(),f=$('filter').value,sort=$('sort').value;let items=words.filter(w=>[w.fr,w.en,w.ja,w.memo].some(v=>(v||'').toLocaleLowerCase().includes(q))&&(f==='all'||(f==='none'?w.rating==null:w.rating===Number(f))));items.sort((a,b)=>sort==='new'?b.createdAt-a.createdAt:sort==='old'?a.createdAt-b.createdAt:sort==='high'?(b.rating??0)-(a.rating??0)||b.createdAt-a.createdAt:(a.rating??0)-(b.rating??0)||b.createdAt-a.createdAt);$('count').textContent=`${items.length}組の単語ペア`;$('cards').replaceChildren(...(items.length?items.map(makeCard):[el('div','empty','単語がありません')]))}
function setTab(tab){activeTab=tab;for(const name of ['list','form','detail','calendar','settings'])$(name+'View').classList.toggle('hidden',name!==tab);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab||(tab==='detail'&&b.dataset.tab===detailReturn)));$('pageTitle').textContent=({list:'単語コレクション',form:editingId?'単語を編集':'新しい単語ペア',detail:'単語の詳細',calendar:'カレンダー',settings:'設定'})[tab];if(tab==='calendar')renderCalendar();window.scrollTo(0,0)}
function drawRating(){const picker=$('ratingPicker');picker.replaceChildren();for(let i=1;i<=5;i++){const b=el('button',i<=rating?'active':'','★');b.type='button';b.setAttribute('aria-label',`${i}つ星`);b.setAttribute('aria-pressed',String(rating===i));b.onclick=()=>{rating=i;drawRating()};picker.append(b)}}
function resetForm(){editingId=null;rating=null;$('wordForm').reset();drawRating();$('cancelEdit').classList.add('hidden');$('saveBtn').textContent='登録する'}
function showDetail(id,origin='list'){const w=words.find(w=>w.id===id);if(!w){setTab('list');return}detailId=id;detailReturn=origin==='calendar'?'calendar':'list';const c=$('detailContent');c.replaceChildren();for(const [title,value,cls] of [['フランス語',w.fr,'detail-word'],['英語',w.en,'detail-word'],['日本語訳',w.ja||'未入力',''],['似てる度',stars(w.rating),'stars'],['メモ',w.memo||'未入力','']]){const sec=el('div','detail-section');sec.append(el('div','heading',title),el('p',cls,value));c.append(sec)}const d=el('div','small muted',`登録日：${localDate(new Date(w.createdAt))}`);c.append(el('hr','divider'),d);setTab('detail')}
function renderCalendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();$('monthTitle').textContent=`${y}年${m+1}月`;const grid=$('calendarGrid');grid.replaceChildren();for(const d of ['日','月','火','水','木','金','土'])grid.append(el('div','weekday',d));const offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++)grid.append(el('div'));for(let d=1;d<=days;d++){const date=localDate(new Date(y,m,d)),b=el('button',selectedDate===date?'selected':'');b.type='button';b.append(document.createTextNode(d));if(words.some(w=>localDate(new Date(w.createdAt))===date))b.append(el('span','dot'));b.onclick=()=>{selectedDate=date;renderCalendar()};grid.append(b)}const [yy,mm,dd]=selectedDate.split('-');$('selectedDateTitle').textContent=`${Number(mm)}月${Number(dd)}日`;const dayWords=words.filter(w=>localDate(new Date(w.createdAt))===selectedDate).sort((a,b)=>b.createdAt-a.createdAt);$('dayCards').replaceChildren(...(dayWords.length?dayWords.map(makeCard):[el('div','empty','この日に登録した単語はありません')]))}
function validWord(w){return w&&typeof w.id==='string'&&w.id.length<200&&typeof w.fr==='string'&&w.fr.trim().length>0&&w.fr.length<=200&&typeof w.en==='string'&&w.en.trim().length>0&&w.en.length<=200&&typeof w.ja==='string'&&w.ja.length<=300&&typeof w.memo==='string'&&w.memo.length<=10000&&(w.rating===null||Number.isInteger(w.rating)&&w.rating>=1&&w.rating<=5)&&typeof w.createdAt==='number'&&Number.isFinite(w.createdAt)&&typeof w.updatedAt==='number'&&Number.isFinite(w.updatedAt)}
$('wordForm').onsubmit=async e=>{e.preventDefault();const now=Date.now(),old=words.find(w=>w.id===editingId),w={id:old?.id||crypto.randomUUID(),fr:$('fr').value.trim(),en:$('en').value.trim(),ja:$('ja').value.trim(),memo:$('memo').value.trim(),rating,createdAt:old?.createdAt||now,updatedAt:now};if(!validWord(w)){notify('入力内容を確認してください');return}try{await txRequest('readwrite',s=>s.put(w));const id=editingId;resetForm();await refresh();if(id)showDetail(id,detailReturn);else setTab('list');notify(id?'更新しました':'登録しました')}catch(err){notify('保存できませんでした：'+err.message)}};
$('editBtn').onclick=()=>{const w=words.find(w=>w.id===detailId);if(!w)return;editingId=w.id;for(const key of ['fr','en','ja','memo'])$(key).value=w[key];rating=w.rating;drawRating();$('cancelEdit').classList.remove('hidden');$('saveBtn').textContent='変更を保存';setTab('form')};$('cancelEdit').onclick=()=>{const id=editingId;resetForm();if(id)showDetail(id,detailReturn);else setTab('list')};$('backBtn').onclick=()=>setTab(detailReturn);
$('deleteBtn').onclick=async()=>{const w=words.find(w=>w.id===detailId);if(!w||!confirm(`「${w.fr} ↔ ${w.en}」を削除しますか？`))return;try{await txRequest('readwrite',s=>s.delete(w.id));await refresh();setTab(detailReturn);notify('削除しました')}catch(e){notify('削除に失敗しました')}};
$('search').oninput=renderList;$('sort').onchange=renderList;$('filter').onchange=renderList;$('clearRating').onclick=()=>{rating=null;drawRating()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='form')resetForm();setTab(b.dataset.tab)});
$('prevMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()-1);selectedDate=localDate(currentMonth);renderCalendar()};$('nextMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()+1);selectedDate=localDate(currentMonth);renderCalendar()};
$('exportBtn').onclick=()=>{const payload={app:'mots-words',version:1,exportedAt:new Date().toISOString(),words};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=`mots-words-backup-${localDate(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('バックアップを書き出しました')};$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw Error('ファイルが大きすぎます');const data=JSON.parse(await file.text());if(data.app!=='mots-words'||data.version!==1||!Array.isArray(data.words)||data.words.length>100000||!data.words.every(validWord)||new Set(data.words.map(w=>w.id)).size!==data.words.length)throw Error('対応していないバックアップ形式です');if(!confirm(`バックアップには${data.words.length}組の単語があります。現在の${words.length}組をすべて置き換えます。続けますか？`))return;await txRequest('readwrite',store=>{store.clear();for(const w of data.words)store.put(w)});await refresh();notify(`${data.words.length}組を復元しました`)}catch(err){notify('復元できません：'+err.message)}};
(async()=>{try{db=await openDB();await refresh();drawRating();setTab('list');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){notify('データベースを開けません：'+e.message)}})();
</script></body></html>
